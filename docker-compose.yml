services:
  neo4j:
    image: neo4j:5-community
    container_name: belvedere-neo4j
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    environment:
      - NEO4J_AUTH=neo4j/${BELVEDERE_NEO4J_PASSWORD:-belvedere-dev}
    volumes:
      - belvedere-data:/data
    networks:
      - belvedere-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s

  app:
    build: .
    container_name: belvedere-app
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      PORT: "3000"
      STATIC_DIR: /app/public
      BELVEDERE_NEO4J_URI: bolt://neo4j:7687
      BELVEDERE_NEO4J_USER: neo4j
      BELVEDERE_NEO4J_PASSWORD: ${BELVEDERE_NEO4J_PASSWORD:-belvedere-dev}
    ports:
      - "3000:3000"
    networks:
      - belvedere-net

networks:
  belvedere-net:

volumes:
  belvedere-data:
